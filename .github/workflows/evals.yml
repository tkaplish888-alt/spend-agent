name: Held-out evals

# Runs the agent on fresh synthetic accounts it was not built around and
# grades each one. Manual only: Actions -> Held-out evals -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Scenario names, space-separated (blank = all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python -m evals.suite --only $ONLY; else python -m evals.suite; fi
      - name: Commit results
        run: |
          git config user.name "spend-agent[bot]"
          git config user.email "spend-agent@users.noreply.github.com"
          git add evals/results.json evals/RESULTS.md evals/runs/*/outputs
          git diff --cached --quiet || git commit -m "Held-out evals $(date -u +%Y-%m-%d)"
          git pull --rebase -q && git push
